name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Test (Node)
        run: pnpm run test-node

      - name: Test (Jest)
        run: pnpm run test-jest

  # The Android build is the most expensive job, so only run it once the
  # cheaper lint/test jobs have passed.
  build-android:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Enables and persists the Gradle build cache + dependency cache across
      # runs (only writes a new cache entry from the default branch).
      - uses: gradle/actions/setup-gradle@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prebuild (Android)
        run: pnpm run prebuild:android

      - name: Build Android apk (debug)
        run: ./gradlew assembleDebug -Dorg.gradle.logging.level=info
        working-directory: android
